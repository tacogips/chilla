name: release-macos-dmg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned macOS bundles
        id: build-unsigned
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        with:
          includeUpdaterJson: false
          tauriScript: bun run tauri
          args: --config src-tauri/tauri.macos.release.conf.json --bundles app,dmg

      - name: Verify macOS bundle outputs
        run: |
          set -euo pipefail

          app_path="target/release/bundle/macos/chilla.app"
          dmg_path=""
          for candidate in target/release/bundle/dmg/*.dmg; do
            if [ -f "$candidate" ]; then
              dmg_path="$candidate"
              break
            fi
          done

          test -d "$app_path"
          test -n "$dmg_path"
          test -f "$dmg_path"

      - name: Upload validation build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chilla-macos-dmg
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

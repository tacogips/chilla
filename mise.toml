min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
node = "22"
bun = "latest"
biome = "latest"
rust = "1.92.0"
rust-analyzer = "latest"
taplo = "latest"
gitleaks = "latest"
pre-commit = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-audit" = "latest"

[tasks."default"]
description = "Show available tasks"
run = '''
mise tasks ls
'''

[tasks."dev-stop"]
description = "Stop repo-local desktop dev processes"
run = '''
pkill -f "$PWD/node_modules/.bin/tauri dev" || true
pkill -f "$PWD/node_modules/.bin/vite" || true
pkill -f "$PWD/target/debug/chilla" || true
'''

[tasks."clean-node-modules"]
description = "Remove frontend dependencies and Bun/Vite build caches"
run = '''
rm -rf node_modules
rm -rf .vite
'''

[tasks."dev"]
description = "Run the desktop app in development mode"
run = '''
mise run dev-stop
rm -rf src-tauri/target/debug
bun run tauri dev
'''

[tasks."dev-clean"]
description = "Run the desktop app in development mode after building frontend assets"
run = '''
mise run dev-stop
bun run build
rm -rf src-tauri/target/debug
bun run tauri dev
'''

[tasks."build"]
description = "Build frontend assets and the desktop binary"
run = '''
bun run build
CARGO_TERM_QUIET=true cargo build --release --manifest-path src-tauri/Cargo.toml
'''

[tasks."tauri-build"]
description = "Build the app through the Tauri CLI"
run = '''
CARGO_TERM_QUIET=true bun run tauri build
'''

[tasks."bundle-macos-dmg"]
description = "Build macOS .app and .dmg bundles through the Tauri release config"
run = '''
bun run build
CARGO_TERM_QUIET=true bun run tauri build --config src-tauri/tauri.macos.release.conf.json --bundles app,dmg
'''

[tasks."release-macos-dmg-local"]
description = "Sign, notarize, validate, and upload macOS DMG release assets from the local keychain"
run = '''
bash scripts/release-macos-dmg-local.sh "$@"
'''

[tasks."test"]
description = "Run frontend and backend verification"
run = '''
bun run typecheck
bun run test
CARGO_TERM_QUIET=true cargo test --manifest-path src-tauri/Cargo.toml
'''

[tasks."test-tauri-e2e-linux"]
description = "Run Linux desktop E2E verification with tauri-driver"
run = '''
bun run test:tauri:e2e:linux
'''

[tasks."check"]
description = "Run frontend typecheck and cargo check"
run = '''
bun run typecheck
CARGO_TERM_QUIET=true cargo check --manifest-path src-tauri/Cargo.toml
'''

[tasks."clippy"]
description = "Run clippy for the Tauri backend"
run = '''
mise run lint-rust
'''

[tasks."lint-ts"]
description = "Run TypeScript lint checks"
run = '''
bash .agents/scripts/lint-ts.sh
'''

[tasks."lint-rust"]
description = "Run Rust lint checks"
run = '''
bash .agents/scripts/lint-rust.sh
'''

[tasks."fmt"]
description = "Format frontend and backend sources"
run = '''
bash .agents/scripts/format-ts.sh
CARGO_TERM_QUIET=true cargo fmt --manifest-path src-tauri/Cargo.toml
'''

[tasks."fmt-check"]
description = "Check backend formatting"
run = '''
CARGO_TERM_QUIET=true cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
'''

[tasks."lint"]
description = "Run all lints (TypeScript, Rust format check, and clippy)"
run = '''
mise run lint-ts
mise run fmt-check
mise run lint-rust
'''

[tasks."verify"]
description = "Run the full local verification suite"
run = '''
mise run check
mise run lint
mise run test
'''

[tasks."clean"]
description = "Clean build artifacts"
run = '''
rm -rf dist
CARGO_TERM_QUIET=true cargo clean --manifest-path src-tauri/Cargo.toml
'''

[tasks."ci"]
description = "Run all CI checks"
run = '''
mise run build
mise run verify
'''
